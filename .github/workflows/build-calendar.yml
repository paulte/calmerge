---
name: Build Calendar

"on":
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Generate merged calendar
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check configuration exists
        id: config
        run: |
          if [ -f calendars.yaml ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Found calendars.yaml"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No calendars.yaml found. Copy calendars.example.yaml to calendars.yaml and configure your calendars."
          fi

      - name: Restore calendar cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: calendar-cache-${{ runner.os }}
          restore-keys: |
            calendar-cache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install project dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Generate merged calendar
        if: steps.config.outputs.configured == 'true'
        run: |
          calmerge --config calendars.yaml

      - name: Commit updated calendar
        if: steps.config.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git show HEAD:calendars/merged.ics | sed '/^DTSTAMP:/d' > /tmp/old.ics || true
          sed '/^DTSTAMP:/d' calendars/merged.ics > /tmp/new.ics

          if cmp -s /tmp/old.ics /tmp/new.ics; then
            echo "No meaningful calendar changes"
            exit 0
          else
            echo "The following calendar changes have been detected"
            diff /tmp/old.ics /tmp/new.ics || true
          fi

          git add calendars/merged.ics

          git commit -m "Update merged calendar"
          git push
