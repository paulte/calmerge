---
name: Build Calendar

"on":
  workflow_call:

permissions:
  contents: write

concurrency:
  group: calendar-build
  cancel-in-progress: true

jobs:
  build:
    name: Generate merged calendar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v5

      - name: Check configuration exists
        id: config
        run: |
          if [ -f calendars.yaml ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Found calendars.yaml"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No calendars.yaml found. Copy calendars.example.yaml to calendars.yaml and configure your calendars."
          fi

      - name: Restore calendar cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: calendar-cache-${{ runner.os }}
          restore-keys: |
            calendar-cache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"    

      - name: Install calmerge
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/paulte/calmerge.git

      - name: Generate merged calendar
        if: steps.config.outputs.configured == 'true'
        run: |
          calmerge --config calendars.yaml

      - name: Commit updated calendar
        if: steps.config.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git show HEAD:calendars/merged.ics | sed '/^DTSTAMP:/d' > /tmp/old.ics || true
          sed '/^DTSTAMP:/d' calendars/merged.ics > /tmp/new.ics

          if cmp -s /tmp/old.ics /tmp/new.ics; then
            echo "No meaningful calendar changes"
            exit 0
          fi

          git add calendars/merged.ics

          git commit -m "Update merged calendar"
          git push
