name: Build Calendar

on:
  push:
    branches:
      - main
    paths:
      - "calendars.yaml"
      - ".github/workflows/build.yml"

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-build
  cancel-in-progress: true

jobs:
  build:
    name: Generate merged calendar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private configuration
        uses: actions/checkout@v5

      - name: Restore calendar cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: calendar-cache-v1
          restore-keys: |
            calendar-cache-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install calmerge
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/paulte/calmerge.git

      - name: Generate merged calendar
        run: |
          calmerge --config calendars.yaml

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendars/merged.ics

          git diff --cached --quiet || git commit -m "Update merged calendar"

          git push