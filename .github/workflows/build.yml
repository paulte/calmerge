---
name: Build Merged calendar
"on":
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  push:
    branches:
      - main
    paths-ignore:
      - "calendars/merged.ics"
  workflow_dispatch:
concurrency:
  group: calendar-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Cache calendar downloads
        uses: actions/cache@v4
        with:
          path: .cache/calendars
          key: calendar-cache-${{ hashFiles('calendars.yaml') }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate calendar
        run: |
              python -u calmerge.py \
                --config calendars.yaml \
                --cache .cache/calendars \
                --output calendars
      - name: Validate generated calendar
        run: |
          test -f calendars/merged.ics
          echo "Generated calendar:"
          ls -lh calendars/merged.ics
          grep -c "BEGIN:VEVENT" calendars/merged.ics || true
      - name: Show cache contents
        run: |
          find .cache -type f -ls || true
      - name: Commit updated merged calendar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add calendars/merged.ics
          if git diff --cached --quiet; then
            echo "No calendar changes"
            exit 0
          fi
          # Remove files where the only change is DTSTAMP
          for file in $(git diff --cached --name-only); do
            if git diff --cached -- "$file" | \
               grep -E '^[+-]' | \
               grep -vE '^(---|\+\+\+)' | \
               grep -qvE '^[+-].*DTSTAMP:'; then
              echo "Real changes detected in $file"
            else
              echo "Ignoring DTSTAMP-only change in $file"
              git reset -- "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Only DTSTAMP changes detected"
            exit 0
          fi
          git commit -m "Update merged calendar"
          git push
