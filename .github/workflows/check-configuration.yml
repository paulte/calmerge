---
name: Check Configuration

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Validate configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install calmerge
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/paulte/calmerge.git

      - name: Validate calendars.yaml
        run: |
          python -c "from pathlib import Path; from calmerge.config import load_config; load_config(Path('calendars.yaml'))"

      - name: Install yamllint
        run: |
          python -m pip install yamllint

      - name: Check YAML
        run: |
          yamllint .

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check workflows
        run: |
          actionlint
