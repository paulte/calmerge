---
name: Check Configuration

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Validate configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check configuration exists
        id: config
        run: |
          if [ -f calendars.yaml ]; then
            echo "has_config=true" >> "$GITHUB_OUTPUT"
            echo "Found calendars.yaml"
          else
            echo "has_config=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No calendars.yaml found. Copy calendars.example.yaml to calendars.yaml and configure your calendars."
          fi

      - name: Set up Python
        if: steps.config.outputs.has_config == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install calmerge
        if: steps.config.outputs.has_config == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/paulte/calmerge.git

      - name: Validate calendars.yaml
        if: steps.config.outputs.has_config == 'true'
        run: |
          python -c "from pathlib import Path; from calmerge.config import load_config; load_config(Path('calendars.yaml'))"

      - name: Install yamllint
        run: |
          python -m pip install yamllint

      - name: Check YAML
        run: |
          yamllint .

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check workflows
        run: |
          actionlint
