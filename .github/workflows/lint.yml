---
name: Lint

"on":
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    name: Code quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
         ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
 
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
        python-version: "3.14"

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Fix Python formatting
        run: ruff format .

      - name: Fix Python lint issues
        run: ruff check --fix .

      - name: Commit automatic fixes
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet; then
            echo "No automatic fixes required"
            exit 0
          fi
 
          # Skip commit/push for pull requests from forks (no write access)
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO_FULL_NAME" != "$BASE_REPO" ]; then
            echo "Automatic fixes needed but skipping commit for fork PR (no write access)"
            echo "Please apply these fixes locally by running: ruff format . && ruff check --fix ."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
 
          git add .
          git commit -m "style: apply automatic lint fixes"

          # Push to the correct branch (head_ref for PRs, current branch for pushes)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git push origin "HEAD:$HEAD_REF"
          else
            git push
          fi
 
     - name: Check Python formatting
        run: ruff format --check .
     - name: Run Ruff lint
       run: ruff check .

     - name: Lint YAML
       run: yamllint .

      - name: Check GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
