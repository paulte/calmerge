---
# Example CalMerge configuration
#
# Copy this file to calendars.yaml and customise:
#
#   cp examples/calendars.example.yaml calendars.yaml
#
# Each calendar requires:
#   name   - unique friendly name
#   url    - ICS calendar URL
#
# Optional:
#   color  - Apple Calendar colour (hex value)
#   prefix - text added to event titles

calendar_name: "My Calendar"

calendars:
  - name: "Example Calendar"
    prefix: "Example"
    url: "https://example.com/calendar.ics"
    color: "#1E90FF"

# Add additional calendars:
#
# - name: "Another Calendar"
#   prefix: "Another"
#   url: "https://example.com/another-calendar.ics"
#   color: "#FF4500"
