[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calmerge"
version = "1.0.0"
description = "Merge ICS calendars into a single calendar"
requires-python = ">=3.14"
dependencies = [
    "icalendar",
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "yamllint",
    "pip-audit",
]

[project.scripts]
calmerge = "calmerge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src/calmerge --cov-report=term-missing"
pythonpath = [
    "src"
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
preview = true

[tool.coverage.run]
branch = true
source = ["calmerge"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
